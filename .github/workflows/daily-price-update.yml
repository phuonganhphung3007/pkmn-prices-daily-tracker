name: Daily Pokémon Price Update

on:
  schedule:
    # 13:17 UTC daily — arbitrary off-peak minute to avoid the top-of-hour
    # crowd on GitHub's shared runners. Adjust to your timezone as needed.
    - cron: "17 13 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

permissions:
  contents: read  # BigQuery is the store now; nothing is committed back

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Fetch today's prices and load into BigQuery
        env:
          PKMNPRICES_API_KEY: ${{ secrets.PKMNPRICES_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: python scripts/fetch_prices.py
