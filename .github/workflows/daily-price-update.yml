name: Daily Pokémon Price Update

# GitHub only honors `schedule:` triggers defined in the repo's default
# branch (main), so main has its own copy of this file that checks out and
# pushes back to db-storage explicitly — main's own tree is intentionally
# left alone by that copy. This copy is for running it manually from the
# db-storage branch directly (Actions tab -> branch selector -> db-storage).

on:
  schedule:
    # 13:17 UTC daily — arbitrary off-peak minute to avoid the top-of-hour
    # crowd on GitHub's shared runners. Adjust to your timezone as needed.
    - cron: "17 13 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write  # needed to commit the updated database back to db-storage

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out db-storage branch
        uses: actions/checkout@v4
        with:
          ref: db-storage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync catalog + fetch today's prices into data/pokemon.db
        env:
          PKMNPRICES_API_KEY: ${{ secrets.PKMNPRICES_API_KEY }}
        run: python scripts/daily_sync.py

      - name: Commit updated data
        run: |
          git config user.name "pkmnprices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily price update: $(date -u +'%Y-%m-%d')"
          git push origin HEAD:db-storage
